name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m
        continue-on-error: true

      - name: Run tests with race detector and coverage
        run: go test -race -coverprofile=coverage.out -v ./...

      - name: Build Indexer and API binaries
        run: |
          go build -v -o /dev/null ./cmd/api
          go build -v -o /dev/null ./cmd/indexer

